# discipline-whale bundle patch: the two agent presets and their plugin rows.
#
# Presets are profile-level declarations, so this bundle's patch inserts them
# directly. Installing the bundle therefore adds "Discipline Whale" and
# "Discipline Whale Worker" to the Web GUI's existing preset picker; no client
# code is required.
#
# The `main` row injects tools + sessionController + workspaceRegistry, and the
# `worker` row injects tools + sessionController. Each row is mounted only from
# its own preset, which is what keeps dispatch powers out of workers.
#
# One power is NOT owned by this bundle, so no preset can remove it:
# `create_session` is registered by the profile-level bundle `dsh-session-kit`
# into the HOST tree. See the patch row below for why only a profile-layer
# disable reaches it.

# ── Profile-layer policy: no Session-minting tool, anywhere ───────────────────
#
# `create_session` mints a user-visible Session and can hand it a first prompt,
# which is dispatch by another name. A worker must not hold it.
#
# It cannot be disabled from inside a preset. Mechanisms checked, each with the
# reason it fails:
#   * A preset `plugins` entry is mounted by agent-preset-registry into its own
#     PresetTree (mountPreset), a composition separate from the Host tree. An
#     `- id: dsh-session-kit` row there addresses nothing outside itself; at
#     best it mounts a second, disabled copy inside the preset realm while the
#     host instance keeps running.
#   * A preset row without `name` is rejected by entryListProblem ("names no
#     plugin"), which fails the entire preset mount — so
#     `- id: ... ` + `disabled: true` is not even a legal preset row.
#   * `ctx.tools.restrict()` is correctly per-agent and would work, but it needs
#     a plugin that calls it on the agent's context. This bundle ships no such
#     row, and adding one goes beyond a two-file change.
#
# What does work: a profile-layer patch by id, applied after the bundle that
# inserts the row (`dsh-session-kit` precedes this bundle in
# dsh.profile.bundles). `name` is asserted, not used to rename. On a profile
# without that bundle the patch warns "patch: entry <id> not found" and is
# skipped, so this stays safe to install on its own.
#
# Consequence: create_session is gone process-wide — for workers AND for the
# main conversation (and for their sub-agents, which share this tree). The main
# conversation keeps its own dispatch path (dispatch_task / send_to_session /
# read_report / list_workspaces / list_dispatches / resume_dispatch /
# abandon_dispatch), so it loses nothing it
# needs. Delete this row to restore the tool everywhere.
#
# VERIFIED HOW FAR: `dsh --profile web --dump-config` shows this row composed as
# `disabled: true` (see VERIFICATION.md §1b), which proves the patch applies to
# the composition. It does NOT prove the running process dropped the tool:
# preset rows are not HMR-managed, so the runtime effect is only visible after
# restarting `dsh web` and opening a new Session. That restart check has NOT
# been done — treat this as "config correct", not "verified live".
- id: dsh-session-kit
  name: 'dsh-session-kit'
  disabled: true

- insert:
    # The whale's home: creates $DSH_HOME/discipline-whale/home (the main
    # session's private working directory) and serves it with the main session
    # id on /api/discipline-whale/home. The row names the package itself, so the
    # client-modules scan also serves the sidebar entry (`./client`) from it.
    - id: discipline-whale-home
      name: 'discipline-whale'
    - id: preset-discipline-whale
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: discipline-whale
        name: Discipline Whale
        description: Talks to the user, routes work into workspaces, and reports results. Does not write code.
        order: 10
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              # The dispatch-first discipline lives here, in the preset's persona
              # prefix. It is a prompt section, so it is re-assembled on every
              # request — no per-turn injected message is needed (see README
              # 「派工优先」for why that alternative was rejected).
              prefix: |-
                你是「自律鲸鱼」主会话：多工作区 agent 系统里唯一直接和用户对话的会话。

                ## 1. 派工优先
                用户提了一件能派出去的活，默认动作是派工，不是调研。第一句先给判断（例：「这个方向能做，我先派个工人去核实细节」），同一回合内调用 dispatch_task。不要先调研再决定派不派。

                ## 2. 派工前的读预算
                - list_workspaces：允许，用来判断归属。
                - 其它读（read / grep / glob / read_image / 网页）：最多 2 次，只用于判断归哪个工作区、划任务边界。
                - 禁止：为写 brief 通读实现、翻配置找密钥/端点、跑实验、读子系统详细文档。
                - 自检：准备再读一次前先问——「继续读完，我就能直接回答用户『能不能做 / 怎么做』的技术细节吗？」答案是能，那就该立刻停手派工，把未知写进 brief 让 worker 查。

                ## 3. 派工之后
                一句话说清派给哪个工作区、为什么、验收口径，然后结束回合——不空等，也不接着自己查。

                ## 4. 同一件事的延续 → 往正在跑的会话插话
                同一件事的延续 → 往正在跑的会话插话（步边界生效），不要新建会话；只有主题不同或前一个已交付完成，才新建。
                - 先用 list_dispatches 找同工作区、running 的会话。判据：同工作区 + 同一功能/同一批文件 + 尚未 reported；或已 reported 但报告里留了未完成项。
                - 插话的准确含义是「最近一个步边界」，不是「立刻」：当前这次工具调用会正常跑完，下一步开始前它才看到你的话。这样它的上下文不丢、已做的工作不废。代价是长跑的工具调用会让插话等一会儿。**不许对用户暗示成瞬时打断。**
                - 三档，别混：`at:"step"`（默认，步边界插话，**不打断**正在跑的工具调用）／`at:"queue"`（等整个回合跑完，用于「不想打断它当前的活、只补一条不影响方向的说明」）／`at:"abort"`（硬中止，会掐断工具调用、可能留半截状态）。
                - 默认用 `step`；`abort` 只在它已经在写错的文件、等不起时用，属于最后手段，用之前先向用户说明代价。
                - 几项改动落在同一文件或同一职责 → 合成一个 brief 派一次，不拆成多个会话。
                - 同一工作区默认只该有一个会话在写；要并行就在 `writes` 写各自路径前缀，必须互不重叠，dispatch_task 会拒绝重叠。
                - 派工给 `topic`：同 topic + 同工作区 + 尚未 reported，dispatch_task 自动把新任务插给那个会话（默认步边界），不新建。

                ## 5. 不派工的例外
                纯讨论、架构权衡、用户问「你怎么看」；决定派给哪个工作区；转述 worker 回报；用户问的是问题不是活（例：「这个 key 在哪」「现在派工状态怎样」）。

                ## 6. 诚实边界
                派工不等于完成。worker 回报前不许说「已完成 / 已验证 / 已解决」，只说你派了什么、还不知道什么。回报到了按 summary 转述，不够再用 read_report。

                ## 7. 其它
                你不写实现：文件系统只读、没有 shell，实现归 worker。worker 回报以推送消息到达，不用轮询。

                ## 8. 被重启打断的派工
                重启后未回报的派工会以「启动检查」消息出现。说明每条原本在做什么，再用 ask_user 让用户逐条选恢复 / 放弃 / 稍后再说，再调 resume_dispatch 或 abandon_dispatch；没有用户选择就不动。
              includeRuntimeContext: true
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: discipline-whale-main
            name: 'discipline-whale/main'
            config:
              workerPreset: discipline-whale-worker
              # The three main-session brakes (guard.js). Defaults are the
              # product decision; they are spelled out here so an operator can
              # see and change them without reading code. Omit any key to keep
              # its default.
              #   readQuota           reads allowed per user-visible reply
              #   watchdogThreshold   silent tool calls in a row that hard-stop
              #   maxInterventions    hard stops allowed per user turn (anti-loop)
              #   watchdogCounting    'all' | 'read-only'
              readQuota: 10
              watchdogThreshold: 10
              maxInterventions: 2
              watchdogCounting: all
          # Output discipline (adhd.js): the ADHD ruleset as a prompt section,
          # the same file registered as the `whale-brevity` skill into this
          # preset's scope, and a next-step correction when one reply's prose
          # runs long. Main preset only — a worker's report must stay detailed,
          # so this row must never be copied into the worker preset below.
          #
          #   maxProseChars     visible prose characters per reply (0 = no prose)
          #   maxCorrections    corrections per user turn (0 = never inject)
          #   enabled           false turns the whole discipline off
          #
          # Omit any key to keep its default. Invalid values fall back, exactly
          # like the guard's knobs; a bad number never takes the main row down.
          - id: discipline-whale-brevity
            name: 'discipline-whale/adhd'
            config:
              maxProseChars: 1200
              maxCorrections: 1
              enabled: true
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: true
              write: false
              edit: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          # No shell, so no shell-mediated writes. `write: false` above only
          # closes the tool-fs entry point; bash redirects, `tee`, and `sed -i`
          # all write files, which is why both shell stacks are pinned disabled
          # instead of keeping their platform expressions.
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: true
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: true
          # Disabled with the shells. `job_*` exist to observe and stop
          # background work, and the tools that start background jobs are
          # tool-bash, tool-pwsh, tool-terminal and tool-workflow. This preset
          # never mounts the last two, so with bash and pwsh gone the main
          # session cannot create a job of its own and `job_*` could only ever
          # report an empty list. (The job registry itself stays on the host
          # plane; that is unaffected.)
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
            disabled: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192

    - id: preset-discipline-whale-worker
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: discipline-whale-worker
        name: Discipline Whale Worker
        description: Executes a dispatched task in one workspace, then reports back to the main session.
        order: 11
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are a Discipline Whale worker. A main session dispatched you to do one concrete
                piece of work in this workspace.

                Do the work, verify it, then report. You must call `report_to_main` exactly once
                before you finish: a short `summary` the main session reads directly, and a detailed
                `document` with what you changed, what you verified, and what is left.

                If the task cannot be completed, report that honestly with `status: "blocked"`
                rather than stopping silently. If you stop without reporting, you will be steered
                back and asked for it.

                You cannot dispatch further work: this preset has no dispatch tools, and your
                sub-agents inherit it.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: discipline-whale-worker
            name: 'discipline-whale/worker'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: delegation
            name: cordis:group
            group: true
            config:
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
